  Served by the service worker when a navigation fails. It is a standalone
  document on purpose: the app shell needs JavaScript to paint, which is
  exactly what may be unavailable here. Styles are inline so this page cannot
  depend on a stylesheet that never made it into the cache.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d2433" />
    <title>Offline | Hesabi</title>
    <link rel="icon" href="/favicon-dark.ico" type="image/x-icon" />
    <style>
      :root {
        --background: #f8fafc;
        --foreground: #1d2433;
        --text: #5a6478;
        --primary: #3572ef;
        --surface: #ffffff;
        --border: rgba(29, 36, 51, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0e121b;
          --foreground: #f8fafc;
          --text: #9aa4b8;
          --primary: #3572ef;
          --surface: #101828;
          --border: rgba(248, 250, 252, 0.1);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family: "Poppins", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 26rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }

      .logo {
        width: 64px;
        height: 64px;
        border-radius: 1rem;
        margin: 0 0 1.5rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 1.75rem;
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--text);
      }

      a.button {
        display: inline-block;
        padding: 0.75rem 2rem;
        border-radius: 0.5rem;
        background: var(--primary);
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }

      a.button:hover {
        opacity: 0.9;
      }

      .status {
        margin: 1.25rem 0 0;
        font-size: 0.8rem;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/mini-logo.png" alt="" width="64" height="64" />

      <h1>You&rsquo;re offline</h1>

      <p>
        Hesabi keeps your finances on the server, so it needs a connection to
        show them. Reconnect and your dashboard will pick up right where you
        left off.
      </p>

      <a class="button" href="/">Try again</a>

      <p class="status" id="status" hidden>
        Connection restored &mdash; reloading&hellip;
      </p>
    </main>

    <script>
      // Progressive enhancement only; the link above is the real control.
      window.addEventListener("online", function () {
        var status = document.getElementById("status");
        if (status) status.hidden = false;
        window.location.replace("/");
      });
    </script>
  </body>
</html>
